name: Release Smart Logger

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, test and publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release version
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "POM version: $VERSION"
          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "ERROR: A Maven Central release cannot use a SNAPSHOT version."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "ERROR: Git tag $GITHUB_REF_NAME does not match POM version $VERSION"
              exit 1
            fi
          fi

      - name: Run tests
        run: mvn -B clean test

      - name: Import release GPG key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "ERROR: MAVEN_GPG_PRIVATE_KEY secret is not configured."
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure Maven Central credentials
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_PASSWORD" ]]; then
            echo "ERROR: Maven Central credentials are not configured."
            exit 1
          fi

          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish to Maven Central
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [[ -z "$GPG_PASSPHRASE" ]]; then
            echo "ERROR: MAVEN_GPG_PASSPHRASE secret is not configured."
            exit 1
          fi

          mvn -B -Prelease deploy \
            -Dgpg.passphrase="$GPG_PASSPHRASE" \
            -Dgpg.useagent=false
